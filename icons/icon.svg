<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3a2f8f"/><stop offset=".6" stop-color="#1c1850"/><stop offset="1" stop-color="#120f33"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e1fb"/>
    </linearGradient>
    <linearGradient id="kaffe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4b22"/><stop offset="1" stop-color="#5a2e12"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- the four team bars around the table -->
  <rect x="232" y="58" width="560" height="74" rx="37" fill="#ffd23f"/>
  <rect x="232" y="892" width="560" height="74" rx="37" fill="#ff8a1f"/>
  <rect x="58" y="262" width="74" height="500" rx="37" fill="#ff4f8b"/>
  <rect x="892" y="262" width="74" height="500" rx="37" fill="#5b86ff"/>
  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" opacity=".85">
    <path d="M430 330c-40-45 40-70 0-120"/>
    <path d="M512 315c-45-55 45-80 0-140"/>
    <path d="M594 330c-40-45 40-70 0-120"/>
  </g>
  <!-- saucer -->
  <ellipse cx="512" cy="742" rx="250" ry="48" fill="#cfc8f2"/>
  <ellipse cx="512" cy="730" rx="250" ry="44" fill="#ffffff"/>
  <!-- handle -->
  <path d="M700 470c95 0 115 140 10 165" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
  <!-- cup -->
  <path d="M305 420h414c0 0 -6 175 -70 255c-30 38 -80 52 -137 52s-107-14-137-52c-64-80-70-255-70-255z" fill="url(#cup)"/>
  <ellipse cx="512" cy="420" rx="207" ry="46" fill="#ffffff"/>
  <ellipse cx="512" cy="424" rx="180" ry="34" fill="url(#kaffe)"/>
  <!-- latte heart -->
  <path d="M512 446c-38-22-58-34-58-48c0-11 9-18 20-18c16 0 30 12 38 22c8-10 22-22 38-22c11 0 20 7 20 18c0 14-20 26-58 48z" fill="#f4e3cf"/>
  <!-- a little stripe in the team colours on the cup -->
  <g>
    <rect x="352" y="540" width="80" height="22" rx="11" fill="#ff8a1f"/>
    <rect x="442" y="540" width="80" height="22" rx="11" fill="#ffd23f"/>
    <rect x="532" y="540" width="80" height="22" rx="11" fill="#ff4f8b"/>
    <rect x="622" y="540" width="56" height="22" rx="11" fill="#5b86ff"/>

<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaffebar Voice Test</title>
<style>
:root{--bg:#f6f1ea;--fg:#2b1d14;--muted:#7a6656;--card:#fffaf4;--line:#e5d8c9;--accent:#8a4b2a;--accent-fg:#fff;--ok:#1d7a3a;--bad:#b3261e;--rec:#d23b2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--fg:#f3e9df;--muted:#b49f8d;--card:#271d17;--line:#3d2f26;--accent:#d08a5c;--accent-fg:#1b1410;--ok:#5fd27a;--bad:#ff7b72;--rec:#ff6a5c}}
:root[data-theme="dark"]{--bg:#1b1410;--fg:#f3e9df;--muted:#b49f8d;--card:#271d17;--line:#3d2f26;--accent:#d08a5c;--accent-fg:#1b1410;--ok:#5fd27a;--bad:#ff7b72;--rec:#ff6a5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
select,input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font:inherit;font-size:15px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
#load{font:inherit;font-weight:600;padding:12px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);width:100%}
#load:disabled{opacity:.5}
progress{width:100%;height:10px;margin-top:10px}
#status{font-size:14px;color:var(--muted);margin-top:8px;min-height:1.4em}
#talk{--lvl:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:170px;border-radius:24px;border:0;font:inherit;
  background:var(--accent);color:var(--accent-fg);transition:background-color .15s,transform .1s;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#talk *{pointer-events:none}
#talk .big{font-size:26px;font-weight:700}
#talk .hint{font-size:15px;opacity:.85}
#talk .icon{font-size:30px;line-height:1}
#talk[data-state=off]{opacity:.45}
#talk[data-state=listening]{background:var(--rec);color:#fff;transform:scale(.98);box-shadow:0 0 0 calc(4px + var(--lvl) * 22px) color-mix(in srgb,var(--rec) 35%,transparent)}
#talk[data-state=thinking]{background:var(--muted);color:var(--bg)}
#talk[data-state=ok]{background:var(--ok);color:#fff}
#talk[data-state=bad],#talk[data-state=short]{background:var(--bad);color:#fff}
#talk[data-state=thinking] .icon{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#mic{font:inherit;font-weight:600;padding:12px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--fg);width:100%;margin-bottom:12px}
#micstate{font-size:14px;color:var(--muted);margin:-4px 0 12px}
#result{font-size:22px;margin:4px 0}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.muted{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
</style>
</head>
<body>
<main>
  <h1>Kaffebar voice test</h1>
  <p class="sub">Speech recognition that runs on this iPad. After the one-time download, nothing goes to a server.</p>

  <section class="card">
    <label for="model">Model</label>
    <select id="model">
      <option value="Xenova/nb-whisper-tiny-beta">Norwegian Whisper tiny (~40 MB, fastest)</option>
      <option value="onnx-community/whisper-base" selected>Whisper base (~80 MB, Norwegian + English)</option>
      <option value="onnx-community/whisper-small">Whisper small (~250 MB, most accurate, slow)</option>
    </select>
    <button id="load" style="margin-top:10px">Load model</button>
    <progress id="prog" max="100" value="0" hidden></progress>
    <div id="status">Not loaded yet.</div>
  </section>

  <section class="card">
    <label>Language to expect</label>
    <div class="seg" id="lang">
      <button data-lang="norwegian" aria-pressed="true">Norsk</button>
      <button data-lang="english" aria-pressed="false">English</button>
    </div>
    <label for="target" style="margin-top:12px">Target word</label>
    <input id="target" type="text" value="kaffe" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="chips" id="chips"></div>
    <p class="muted" style="margin:10px 0 0">The model is told to expect these words, like the word list in the game.</p>
  </section>

  <section class="card">
    <button id="mic">🎤 Turn on microphone</button>
    <div id="micstate">Microphone is off.</div>
    <button id="talk" data-state="off"><span class="icon">🎙️</span><span class="big">Load a model first</span><span class="hint"></span></button>
    <div id="result" style="margin-top:12px"></div>
    <div id="detail" class="muted"></div>
  </section>

  <section class="card">
    <label>Tries</label>
    <table>
      <thead><tr><th>Target</th><th>Heard</th><th>Match</th><th>Talk</th><th>Think</th></tr></thead>
      <tbody id="log"></tbody>
    </table>
  </section>
</main>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1";

const $ = (id) => document.getElementById(id);
const CHIPS = [["kaffe","norwegian"],["vaffel","norwegian"],["brunost","norwegian"],["en kopp te","norwegian"],["sjokolade","norwegian"],["coffee","english"],["waffle","english"]];
let lang = "norwegian", asr = null, loading = false;

// --- language + target word -------------------------------------------------
function setLang(l) {
  lang = l;
  for (const b of $("lang").children) b.setAttribute("aria-pressed", String(b.dataset.lang === l));
}
$("lang").onclick = (e) => { const b = e.target.closest("button"); if (b) setLang(b.dataset.lang); };
for (const [w, l] of CHIPS) {
  const b = document.createElement("button");
  b.textContent = w;
  b.onclick = () => { $("target").value = w; setLang(l); };
  $("chips").appendChild(b);
}

// --- model loading ------------------------------------------------------------
// WebGPU first (fast), then the CPU path, which every iPad can run.
function attempts() {
  const list = [];
  if (navigator.gpu) list.push({ device: "webgpu", dtype: { encoder_model: "fp32", decoder_model_merged: "q4" }, name: "graphics chip" });
  list.push({ device: "wasm", dtype: "q8", name: "processor" });
  return list;
}

$("load").onclick = async () => {
  if (loading) return;
  enableMic();
  loading = true;
  $("load").disabled = true;
  asr = null;
  setTalk("off", "Loading model…", "");
  const id = $("model").value;
  const files = new Map();
  $("prog").hidden = false;
  for (const a of attempts()) {
    try {
      $("status").textContent = `Loading on the ${a.name}…`;
      const t0 = performance.now();
      const model = await pipeline("automatic-speech-recognition", id, {
        device: a.device, dtype: a.dtype,
        progress_callback: (p) => {
          if (p.status === "progress" && p.total) {
            files.set(p.file, [p.loaded, p.total]);
            let l = 0, t = 0;
            for (const [x, y] of files.values()) { l += x; t += y; }
            $("prog").value = (100 * l) / t;
            $("status").textContent = `Downloading ${(l / 1e6).toFixed(0)} of ${(t / 1e6).toFixed(0)} MB (only the first time)…`;
          }
        },
      });
      // Warm up so the first real try isn't slow.
      $("status").textContent = "Warming up…";
      await model(new Float32Array(16000), { language: "norwegian", task: "transcribe" });
      asr = model;
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      $("status").textContent = `Ready on the ${a.name} (${secs} s to load). Hold the button and say the word.`;
      break;
    } catch (err) {
      console.error(err);
      asr = null;
      $("status").textContent = `Couldn't load on the ${a.name}: ${err.message || err}`;
    }
  }
  $("prog").hidden = true;
  $("load").disabled = false;
  loading = false;
  idle();
};
$("model").onchange = () => { asr = null; $("status").textContent = "Not loaded yet."; idle(); };

// --- talk button states ----------------------------------------------------------
const talkBtn = $("talk");
function setTalk(state, big, hint, icon) {
  talkBtn.dataset.state = state;
  talkBtn.querySelector(".big").textContent = big;
  talkBtn.querySelector(".hint").textContent = hint;
  talkBtn.querySelector(".icon").textContent = icon || { listening: "🔴", thinking: "⏳", ok: "✅", bad: "❌", short: "✋" }[state] || "🎙️";
}
function idle() {
  if (recording || busy) return;
  if (!asr) setTalk("off", "Load a model first", "");
  else if (!stream) setTalk("off", "Turn on the microphone", "Tap the button above");
  else setTalk("idle", "Hold to talk", "Press and keep holding while you say the word");
}

// --- microphone -----------------------------------------------------------------
// Asked for on a plain tap (Turn on microphone, or Load model) so Safari shows its prompt.
// The stream then stays open, and a short pre-roll keeps the first sound of a word.
let ctx, stream, chunks = [], preroll = [], peak = 0, recording = false, held = false, busy = false, startedAt = 0, micAsk = null;

function enableMic() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  if (stream || micAsk) return micAsk;
  $("micstate").textContent = "Waiting for you to allow the microphone…";
  micAsk = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
    .then((s) => {
      stream = s;
      const node = ctx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = (e) => {
        const d = new Float32Array(e.inputBuffer.getChannelData(0));
        if (recording) {
          chunks.push(d);
          let m = 0;
          for (let i = 0; i < d.length; i++) m = Math.max(m, Math.abs(d[i]));
          peak = Math.max(peak, m);
          talkBtn.style.setProperty("--lvl", Math.min(1, m * 3).toFixed(2));
        } else {
          preroll.push(d);
          if (preroll.length > 4) preroll.shift();
        }
      };
      ctx.createMediaStreamSource(s).connect(node);
      node.connect(ctx.destination);
      $("mic").hidden = true;
      $("micstate").textContent = "Microphone is on.";
      idle();
    })
    .catch((err) => {
      $("micstate").innerHTML = err.name === "NotAllowedError"
        ? `<span class="bad">Microphone blocked.</span> Tap <b>aA</b> in Safari's address bar → Website Settings → Microphone → Allow, then reload this page.`
        : `<span class="bad">No microphone:</span> ${esc(err.message || err.name)}`;
    })
    .finally(() => { micAsk = null; });
  return micAsk;
}
$("mic").onclick = () => enableMic();

function beep(freq) {
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
  o.connect(g).connect(ctx.destination);
  o.start(t0);
  o.stop(t0 + 0.09);
}

// Whisper wants 16 kHz mono.
async function to16k(samples, rate) {
  if (rate === 16000) return samples;
  const off = new OfflineAudioContext(1, Math.ceil((samples.length * 16000) / rate), 16000);
  const buf = off.createBuffer(1, samples.length, rate);
  buf.copyToChannel(samples, 0);
  const s = off.createBufferSource();
  s.buffer = buf;
  s.connect(off.destination);
  s.start();
  return (await off.startRendering()).getChannelData(0);
}

function start() {
  if (!asr || !stream || recording || busy) return;
  held = true;
  ctx.resume();
  chunks = preroll.slice();
  peak = 0;
  recording = true;
  startedAt = performance.now();
  beep(880);
  setTalk("listening", "Speak now", "Let go when you're done");
  $("result").textContent = "";
  $("detail").textContent = "";
}

async function stop() {
  if (!held) return;
  held = false;
  if (!recording) return;
  busy = true;
  const talk = (performance.now() - startedAt) / 1000;
  setTalk("thinking", "Thinking…", "Don't talk yet");
  // Keep a short tail so the last sound isn't cut off.
  await new Promise((r) => setTimeout(r, 250));
  recording = false;
  talkBtn.style.setProperty("--lvl", 0);
  beep(620);
  if (talk < 0.35) {
    setTalk("short", "Too quick", "Keep holding the button while you talk");
    setTimeout(() => { busy = false; idle(); }, 1500);
    return;
  }
  if (peak < 0.02) {
    setTalk("short", "Didn't hear anything", "Speak a bit louder, closer to the iPad");
    setTimeout(() => { busy = false; idle(); }, 1500);
    return;
  }
  const len = chunks.reduce((n, c) => n + c.length, 0);
  const all = new Float32Array(len);
  let o = 0;
  for (const c of chunks) { all.set(c, o); o += c.length; }
  const target = $("target").value.trim();
  let ok = false;
  try {
    const audio = await to16k(all, ctx.sampleRate);
    const t0 = performance.now();
    const heard = await recognise(audio, lang, wordList(target));
    const think = (performance.now() - t0) / 1000;
    const score = matchScore(heard, target);
    ok = score >= 0.8;
    setTalk(ok ? "ok" : "bad", ok ? "Riktig!" : "Not a match", `Heard “${heard || "…"}”`);
    $("result").innerHTML = `${ok ? '<span class="ok">✓ Riktig</span>' : '<span class="bad">✗ Not a match</span>'} &nbsp;“${esc(heard) || "…"}”`;
    $("detail").textContent = `Match ${(score * 100).toFixed(0)}% · you talked ${talk.toFixed(1)} s · recognised in ${think.toFixed(2)} s`;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(target)}</td><td>${esc(heard)}</td><td class="${ok ? "ok" : "bad"}">${(score * 100).toFixed(0)}%</td><td>${talk.toFixed(1)} s</td><td>${think.toFixed(2)} s</td>`;
    $("log").prepend(tr);
  } catch (err) {
    console.error(err);
    setTalk("bad", "Something went wrong", "See the message below");
    $("result").innerHTML = `<span class="bad">Error:</span> ${esc(err.message || String(err))}`;
  }
  setTimeout(() => { busy = false; idle(); }, 1500);
}

// Touch events with preventDefault stop iOS from selecting text, zooming or
// cancelling the press; the mouse handlers cover desktop testing.
const opt = { passive: false };
talkBtn.addEventListener("touchstart", (e) => { e.preventDefault(); start(); }, opt);
talkBtn.addEventListener("touchend", (e) => { e.preventDefault(); stop(); }, opt);
talkBtn.addEventListener("touchcancel", (e) => { e.preventDefault(); stop(); }, opt);
talkBtn.addEventListener("touchmove", (e) => e.preventDefault(), opt);
talkBtn.addEventListener("mousedown", (e) => { e.preventDefault(); start(); });
window.addEventListener("mouseup", () => stop());
talkBtn.addEventListener("contextmenu", (e) => e.preventDefault());
talkBtn.addEventListener("selectstart", (e) => e.preventDefault());

// --- recognition ----------------------------------------------------------------
// Whisper on its own turns a learner's "kaffe" into café or coffee. Two things fix most of that:
// the language token is forced, and the game's word list goes in as a prompt (Whisper's
// "previous text"), which pulls the spelling toward the words we expect.
function wordList(target) {
  const words = CHIPS.filter(([, l]) => l === lang).map(([w]) => w);
  if (target && !words.includes(target)) words.unshift(target);
  return words;
}
async function recognise(audio, language, words) {
  try {
    const { model, tokenizer, processor } = asr;
    const id = (tok) => tokenizer.convert_tokens_to_ids(tok);
    const code = language === "english" ? "en" : "no";
    const prompt = tokenizer.encode(" " + words.join(", ") + ".", { add_special_tokens: false }).slice(-100);
    const init = [id("<|startofprev|>"), ...prompt, id("<|startoftranscript|>"), id(`<|${code}|>`), id("<|transcribe|>"), id("<|notimestamps|>")];
    if (init.some((x) => x == null)) throw new Error("model has no prompt tokens");
    const inputs = await processor(audio);
    const out = await model.generate({ ...inputs, decoder_input_ids: init, max_new_tokens: 24 });
    const ids = out.tolist()[0].map(Number).slice(init.length);
    return tokenizer.decode(ids, { skip_special_tokens: true }).trim();
  } catch (err) {
    // Fall back to plain transcription in the chosen language.
    console.warn("prompted recognition failed, using plain transcription", err);
    const out = await asr(audio, { language, task: "transcribe" });
    return (out.text || "").trim();
  }
}

// --- matching -------------------------------------------------------------------
// Close enough counts: compare the target with every same-length run of heard words.
function norm(s) {
  return s.toLowerCase().normalize("NFC").replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0];
    d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return d[b.length];
}
function sim(a, b) { return a || b ? 1 - lev(a, b) / Math.max(a.length, b.length) : 1; }
// Rough sound-alike spelling, so café / cafe / kafe / kaffe all compare as "kafe".
function sound(s) {
  return s.replace(/[éèêë]/g, "e").replace(/[áàâ]/g, "a").replace(/[óòô]/g, "o").replace(/[üû]/g, "u")
    .replace(/ph/g, "f").replace(/ch/g, "k").replace(/c(?=[eiy])/g, "s").replace(/[cq]/g, "k")
    .replace(/w/g, "v").replace(/z/g, "s").replace(/(.)\1+/g, "$1");
}
function matchScore(heard, target) {
  const h = norm(heard).split(" ").filter(Boolean), t = norm(target);
  if (!t) return 0;
  const n = t.split(" ").length;
  const runs = [h.join(" ")];
  for (let i = 0; i + n <= h.length; i++) runs.push(h.slice(i, i + n).join(" "));
  let best = 0;
  for (const r of runs) best = Math.max(best, sim(r, t), sim(sound(r), sound(t)));
  return best;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
</script>
</body>
</html>
